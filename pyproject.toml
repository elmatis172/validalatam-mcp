[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "validalatam-mcp"
version = "0.2.0"
description = "MCP server for the ValidaLatam API: validate CUIT, CPF, CNPJ, RFC, CURP, RUT, NIT, RUC, CLABE, CBU, IBAN"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Matias Pengue", email = "faucolabs@gmail.com" }]
keywords = ["mcp", "mcp-server", "latam", "validation", "cuit", "cpf", "rfc"]
dependencies = ["mcp>=1.2", "httpx>=0.27"]

[project.optional-dependencies]
test = ["pytest", "respx"]

[project.urls]
Homepage = "https://validalatam.ia-latam.app"
Repository = "https://github.com/elmatis172/validalatam-mcp"
RapidAPI = "https://rapidapi.com/MatiasPengue/api/validalatam"

[project.scripts]
validalatam-mcp = "validalatam_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/validalatam_mcp"]
